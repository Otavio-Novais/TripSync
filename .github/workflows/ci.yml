name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-secret-key
      DATABASE_URL: sqlite:///db.sqlite3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrações em dia
        run: python manage.py makemigrations --check --dry-run

      - name: Testes
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/tripsync-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/tripsync-frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build (lint incluso; avisos falham o build)
        run: npm run build
        env:
          CI: "true"
